<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satzwerk</title>
<meta name="description" content="Trainingsplan in 4-Wochen-Blöcken mit geführtem Training, Übungsvorlagen und Stoppuhr.">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Satzwerk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="7" y="11" width="10" height="2" fill="currentColor"/><rect x="3.5" y="7" width="3" height="10" rx=".8" fill="currentColor"/><rect x="17.5" y="7" width="3" height="10" rx=".8" fill="currentColor"/><rect x="1" y="10" width="2" height="4" rx=".6" fill="currentColor"/><rect x="21" y="10" width="2" height="4" rx=".6" fill="currentColor"/></svg>
      </div>
      <div class="top-t">
        <h1 class="brand">Satzwerk</h1>
        <p class="top-sub" id="top-sub"></p>
      </div>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" aria-label="Bereiche">
      <button type="button" data-tab="heute"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8v8M17 8v8M4.5 10v4M19.5 10v4"/></svg>Training</button>
      <button type="button" data-tab="woche"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Woche</button>
      <button type="button" data-tab="verlauf"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Verlauf</button>
    </nav>
  </div>

  <form id="wizard" class="wizard" novalidate hidden></form>
  <section id="player" class="player" aria-label="Training" hidden></section>
  <div id="sheet" class="sheet" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Offline-Betrieb. Bei jedem Öffnen (auch aus dem Hintergrund) nach einer neuen Version suchen;
    // ist eine da, sofort neu laden, aber nie mitten in einer laufenden Einheit (window.appBusy).
    if ("serviceWorker" in navigator) {
      const hadSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadSW) return;
        const reload = () => { if (!(window.appBusy && window.appBusy())) { location.reload(); return true; } };
        if (!reload()) { const t = setInterval(() => reload() && clearInterval(t), 2000); }
      });
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
      }).catch(() => {});
    }
  </script>
</body>
</html>
